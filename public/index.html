<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04080f">
<link rel="manifest" href="manifest.json">
<title>JARVIS</title>
<style>
  :root {
    --bg: #04080f;
    --panel: #0a1220;
    --cyan: #4fd8eb;
    --cyan-dim: #1d5f6b;
    --text: #cfe9ee;
    --gold: #e8b64c;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -10%, #0b1a2e 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "SF Mono", "Segoe UI", system-ui, monospace;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid #12283d;
  }
  .reactor {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--cyan);
    box-shadow: 0 0 12px var(--cyan), inset 0 0 10px var(--cyan);
    position: relative; flex-shrink: 0;
    animation: pulse 2.4s ease-in-out infinite;
  }
  .reactor::after {
    content: ""; position: absolute; inset: 8px; border-radius: 50%;
    border: 1px solid var(--cyan);
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 10px var(--cyan), inset 0 0 8px var(--cyan); }
    50% { box-shadow: 0 0 22px var(--cyan), inset 0 0 14px var(--cyan); }
  }
  .thinking .reactor { animation-duration: 0.7s; }
  h1 { font-size: 17px; letter-spacing: 6px; color: var(--cyan); font-weight: 500; }
  #status { margin-left: auto; font-size: 11px; color: var(--cyan-dim); letter-spacing: 1px; text-transform: uppercase; }
  #log {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 85%; padding: 10px 14px; border-radius: 4px;
    font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
  }
  .user {
    align-self: flex-end; background: #14293f;
    border-right: 2px solid var(--gold);
  }
  .jarvis {
    align-self: flex-start; background: var(--panel);
    border-left: 2px solid var(--cyan);
  }
  .err { border-left-color: #e85c5c; color: #f0b0b0; }
  form {
    display: flex; gap: 8px; padding: 12px 14px;
    border-top: 1px solid #12283d;
  }
  input {
    flex: 1; background: var(--panel); border: 1px solid #1a3a55;
    color: var(--text); padding: 12px 14px; border-radius: 4px;
    font-size: 16px; font-family: inherit; outline: none;
  }
  input:focus { border-color: var(--cyan-dim); box-shadow: 0 0 8px #4fd8eb33; }
  button {
    background: transparent; border: 1px solid var(--cyan);
    color: var(--cyan); padding: 0 18px; border-radius: 4px;
    font-size: 14px; letter-spacing: 2px; cursor: pointer;
  }
  button:active { background: #4fd8eb22; }
</style>
</head>
<body>
  <header id="hdr">
    <div class="reactor"></div>
    <h1>JARVIS</h1>
    <span id="status">offline</span>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="At your service, sir…" autocomplete="off">
    <button>SEND</button>
  </form>
<script>
  const log = document.getElementById("log");
  const status = document.getElementById("status");
  const hdr = document.getElementById("hdr");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  let ws;

  function connect() {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    ws.onopen = () => (status.textContent = "online");
    ws.onclose = () => { status.textContent = "reconnecting"; setTimeout(connect, 2000); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === "reply") { add(m.text, "jarvis"); setThinking(false); }
      if (m.type === "error") { add(m.text, "jarvis err"); setThinking(false); }
      if (m.type === "status") {
        if (m.text === "idle") setThinking(false);
        else { setThinking(true); status.textContent = m.text; }
      }
    };
  }
  function setThinking(on) {
    hdr.classList.toggle("thinking", on);
    if (!on) status.textContent = "online";
  }
  function add(text, cls) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }
  form.onsubmit = (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || ws.readyState !== 1) return;
    add(text, "user");
    ws.send(JSON.stringify({ text }));
    input.value = "";
  };
  connect();
</script>
</body>
</html>
