<!--
THESIS: Jarvis reads as a Chief of Staff's operating dashboard, not a chat toy — bold mono numbers and one committed red carry priority, replacing the dark "AI reactor" costume.
OWN-WORLD: warm off-white ground, near-black ink, ONE saturated accent (signal red #E8432E) carrying priority/action; IBM Plex Sans for text, IBM Plex Mono for every number; bento cards, 20px radius, photo banners as evidence not decoration.
STORY: Tom opens the app, sees exactly one thing that needs him now (priority queue, red = critical), his race countdown and today's training, and what Jarvis has learned about him — in that order, then acts.
FIRST VIEWPORT: header with J-badge mark, then the priority queue card full-width (red accent, one item, two actions), coach card and learned card below.
FORM: user-supplied reference comps (bento health/sales dashboards), fused with Jarvis's existing Operate-mode product truth; no concept-seed roll — direction was pinned by the user's own reference images.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f2">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<title>JARVIS</title>
<style>
  :root {
    --bg: #f7f5f1;
    --surface: #ffffff;
    --ink: #171614;
    --ink-dim: #7a766e;
    --line: #eae6df;
    --accent: #e8432e;
    --accent-ink: #ffffff;
    --accent-tint: #fdeae7;
    --high: #c8790f;
    --high-tint: #fbf0dd;
    --mail: #c8790f;
    --cal: #2f6feb;
    --task: #6e56cf;
    --radius: 20px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .num { font-family: "IBM Plex Mono", monospace; font-weight: 600; letter-spacing: -0.02em; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 18px; border-bottom: 1px solid var(--line);
  }
  .badge {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 16px;
    box-shadow: 0 4px 10px -4px rgba(232,67,46,0.55);
    position: relative;
  }
  .thinking .badge::after {
    content: ""; position: absolute; inset: -4px; border-radius: 13px;
    border: 2px solid var(--accent); animation: ring 1s ease-out infinite;
  }
  @keyframes ring { from { opacity: 0.9; transform: scale(0.9); } to { opacity: 0; transform: scale(1.25); } }
  h1 { font-size: 14px; letter-spacing: 3px; color: var(--ink); font-weight: 700; }
  #viewToggle {
    margin-left: auto; background: var(--ink); border: none;
    color: #fff; font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 1.5px;
    padding: 8px 14px; border-radius: 100px; cursor: pointer; font-weight: 600;
  }
  #status { font-size: 10px; color: var(--ink-dim); letter-spacing: 1px; text-transform: uppercase; }

  /* Dashboard */
  #dash { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  #dash.active { display: flex; }
  #widgets { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }

  .widget {
    background: var(--surface); border-radius: var(--radius); overflow: hidden;
    box-shadow: 0 1px 2px rgba(20,18,15,0.04), 0 12px 28px -18px rgba(20,18,15,0.25);
    border: 1px solid var(--line);
  }
  .widget-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
  .widget h2 {
    font-size: 10px; letter-spacing: 2px; color: var(--ink-dim); font-weight: 700;
    display: flex; align-items: center; justify-content: space-between; text-transform: uppercase;
  }
  .widget .empty { font-size: 13px; color: var(--ink-dim); padding: 4px 0; }
  .widget .empty a { color: var(--accent); font-weight: 600; text-decoration: none; }

  .banner { height: 92px; background-size: cover; background-position: center; position: relative; }
  .banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(23,22,20,0.35), rgba(23,22,20,0) 55%); }

  /* Attention queue: the committed-red card */
  #wAttention { border-color: var(--accent); }
  #wAttention .widget-body { background: var(--accent-tint); }
  #attnCard .prio {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10px; letter-spacing: 1.5px; font-weight: 700; text-transform: uppercase;
    color: var(--accent-ink); background: var(--accent);
    padding: 4px 10px; border-radius: 100px; width: fit-content;
  }
  #attnCard .prio.high { background: var(--high); }
  #attnCard .label { font-size: 17px; line-height: 1.4; font-weight: 600; margin-top: 8px; }
  #attnCard .meta { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
  #attnActions { display: flex; gap: 8px; margin-top: 10px; }
  .btn {
    flex: 1; background: var(--ink); border: none; color: #fff;
    padding: 11px; border-radius: 12px; font: inherit; font-size: 12px; font-weight: 600;
    letter-spacing: 0.5px; cursor: pointer;
  }
  .btn.secondary { background: transparent; border: 1px solid #d8d2c8; color: var(--ink); }
  .btn:hover { opacity: 0.85; }
  #attnProgress { font-size: 11px; color: var(--ink-dim); font-family: "IBM Plex Mono", monospace; }

  /* Coach widget */
  #wCoach .banner { background-image: url("https://images.unsplash.com/photo-1552674605-db6ffd4facb5?q=80&w=900&auto=format&fit=crop"); }
  .countdown { display: flex; align-items: baseline; gap: 8px; }
  .countdown .n { font-size: 34px; line-height: 1; color: var(--accent); }
  .countdown .l { font-size: 11px; color: var(--ink-dim); letter-spacing: 0.5px; }
  .coachToday { font-size: 14px; line-height: 1.5; font-weight: 500; }
  .coachUpcoming { font-size: 12px; color: var(--ink-dim); line-height: 1.7; }
  .coachUpcoming .num { color: var(--ink); }
  .coachWarn {
    font-size: 12px; color: #9a4a10; background: var(--high-tint);
    padding: 6px 10px; border-radius: 8px; font-weight: 600;
  }
  .coachActivity { font-size: 11px; color: var(--ink-dim); border-top: 1px solid var(--line); padding-top: 8px; }

  #wLearned .banner { background-image: url("https://images.unsplash.com/photo-1719650592946-55163c4994cb?q=80&w=900&auto=format&fit=crop"); }
  .learningItem { font-size: 13px; line-height: 1.5; padding: 8px 0; border-top: 1px solid var(--line); }
  .learningItem:first-child { border-top: none; padding-top: 0; }

  .feedbackPrompt {
    font-size: 12px; color: var(--ink-dim); display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0c9c2;
  }
  .feedbackPrompt button {
    background: #fff; border: 1px solid #f0c9c2; border-radius: 8px;
    font-size: 14px; cursor: pointer; padding: 4px 8px; margin-left: 6px;
  }

  /* Chat */
  #chat { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  #chat.active { display: flex; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 11px 15px; border-radius: 16px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
  .jarvis { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .err { background: var(--accent-tint); border-color: #f0c9c2; color: #9a2c1c; }
  form { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); background: var(--surface); }
  input[type=text] {
    flex: 1; background: var(--bg); border: 1px solid var(--line);
    color: var(--ink); padding: 12px 15px; border-radius: 100px;
    font-size: 16px; font-family: inherit; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  form button {
    background: var(--accent); border: none; color: #fff;
    padding: 0 22px; border-radius: 100px; font-size: 13px; font-weight: 700; letter-spacing: 1px; cursor: pointer;
  }
  #login {
    position: fixed; inset: 0; background: var(--bg); z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  }
  #login .badge { width: 64px; height: 64px; border-radius: 18px; font-size: 28px; }
  #login .tagline { letter-spacing: 3px; color: var(--ink-dim); font-size: 12px; font-weight: 600; }
</style>
</head>
<body>
  <header id="hdr">
    <div class="badge">J</div>
    <h1>JARVIS</h1>
    <span id="status">offline</span>
    <button id="viewToggle">CHAT</button>
  </header>

  <div id="login">
    <div class="badge">J</div>
    <div class="tagline">IDENTIFY YOURSELF</div>
    <div id="gbtn"></div>
    <div id="loginerr" style="color:#c0392b;font-size:12px"></div>
  </div>

  <div id="dash" class="active">
    <div id="widgets">
      <div class="widget" id="wAttention">
        <div class="widget-body">
          <h2><span>NEEDS ATTENTION</span><span id="attnProgress"></span></h2>
          <div id="attnCard"><div class="empty">Loading…</div></div>
          <div id="attnActions" style="display:none">
            <button class="btn" id="attnDismiss">ERLEDIGT</button>
            <button class="btn secondary" id="attnSkip">SPÄTER →</button>
          </div>
        </div>
      </div>

      <div class="widget" id="wCoach">
        <div class="banner"></div>
        <div class="widget-body">
          <h2>RUNNING COACH</h2>
          <div id="coachBody"><div class="empty">Loading…</div></div>
        </div>
      </div>

      <div class="widget" id="wLearned">
        <div class="banner"></div>
        <div class="widget-body">
          <h2>GELERNT</h2>
          <div id="learnedBody"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>
  </div>

  <div id="chat">
    <div id="log"></div>
  </div>

  <form id="form">
    <input type="text" id="input" placeholder="At your service, sir…" autocomplete="off">
    <button>SEND</button>
  </form>

<script src="https://accounts.google.com/gsi/client" async></script>
<script>
  const $ = (id) => document.getElementById(id);
  const BACKEND = new URLSearchParams(location.search).get("backend") ?? localStorage.getItem("backend") ?? location.origin;
  if (new URLSearchParams(location.search).get("backend")) localStorage.setItem("backend", BACKEND);
  const WS_URL = BACKEND.replace(/^http/, "ws") + "/ws";
  let ws, idToken = sessionStorage.getItem("idToken");

  // ---------- view toggle ----------
  let view = "dash";
  $("viewToggle").onclick = () => {
    view = view === "dash" ? "chat" : "dash";
    $("dash").classList.toggle("active", view === "dash");
    $("chat").classList.toggle("active", view === "chat");
    $("viewToggle").textContent = view === "dash" ? "CHAT" : "DASHBOARD";
  };

  // ---------- auth ----------
  async function initLogin() {
    try {
      const cfg = await fetch(BACKEND + "/config").then((r) => r.json());
      google.accounts.id.initialize({
        client_id: cfg.googleClientId,
        callback: (resp) => { idToken = resp.credential; sessionStorage.setItem("idToken", idToken); connect(); },
      });
      google.accounts.id.renderButton($("gbtn"), { theme: "outline", size: "large" });
    } catch { $("loginerr").textContent = "Backend unreachable: " + BACKEND; }
  }

  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => { $("status").textContent = "authenticating"; ws.send(JSON.stringify({ type: "auth", token: idToken })); };
    ws.onclose = () => { $("status").textContent = "reconnecting"; setTimeout(connect, 2000); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === "authed") { $("login").style.display = "none"; $("status").textContent = "online"; loadDashboard(); }
      if (m.type === "reply") { add(m.text, "jarvis"); setThinking(false); loadDashboard(); }
      if (m.type === "error") {
        if (m.text === "Access denied." || m.text === "Not authenticated.") {
          sessionStorage.removeItem("idToken"); idToken = null; if (ws) ws.onclose = null;
          $("login").style.display = "flex"; $("loginerr").textContent = m.text; return;
        }
        add(m.text, "jarvis err"); setThinking(false);
      }
      if (m.type === "status") {
        if (m.text === "idle") setThinking(false);
        else { setThinking(true); $("status").textContent = m.text; }
      }
    };
  }
  function setThinking(on) { $("hdr").classList.toggle("thinking", on); if (!on) $("status").textContent = "online"; }
  function add(text, cls) {
    if (view !== "chat") $("viewToggle").click();
    const d = document.createElement("div");
    d.className = "msg " + cls; d.textContent = text;
    $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
  }
  $("form").onsubmit = (e) => {
    e.preventDefault();
    const text = $("input").value.trim();
    if (!text || !ws || ws.readyState !== 1) return;
    add(text, "user");
    ws.send(JSON.stringify({ text }));
    $("input").value = "";
  };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // ---------- dashboard widgets ----------
  let attnQueue = [], attnIndex = 0, interactionCount = 0;

  async function loadDashboard() {
    try {
      const r = await fetch(BACKEND + "/api/dashboard", { headers: { Authorization: "Bearer " + idToken } });
      if (!r.ok) return;
      const data = await r.json();
      attnQueue = data.attention || []; attnIndex = 0;
      renderAttentionCard();
      renderCoach(data.training);
      renderLearned(data.learnings);
    } catch {}
  }
  setInterval(loadDashboard, 5 * 60 * 1000);

  function renderAttentionCard() {
    const card = $("attnCard"), actions = $("attnActions"), progress = $("attnProgress");
    if (attnIndex >= attnQueue.length) {
      card.innerHTML = '<div class="empty">Nichts Dringendes — sauber.</div>';
      actions.style.display = "none"; progress.textContent = "";
      return;
    }
    const it = attnQueue[attnIndex];
    card.innerHTML = `
      <div class="prio ${esc(it.priority)}">${it.priority} · ${esc(it.type)}</div>
      <div class="label">${esc(it.label)}</div>
      ${it.meta ? `<div class="meta">${esc(it.meta)}</div>` : ""}
    `;
    actions.style.display = "flex";
    progress.innerHTML = `<span class="num">${attnIndex + 1}/${attnQueue.length}</span>`;
  }

  async function interact(item, action) {
    interactionCount++;
    try {
      await fetch(BACKEND + "/api/dashboard/interact", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + idToken },
        body: JSON.stringify({ itemType: item.type, action, label: item.label }),
      });
    } catch {}
    attnIndex++;
    renderAttentionCard();
    maybeShowFeedbackPrompt();
  }
  $("attnDismiss").onclick = () => interact(attnQueue[attnIndex], "dismiss");
  $("attnSkip").onclick = () => interact(attnQueue[attnIndex], "skip");

  function maybeShowFeedbackPrompt() {
    if (interactionCount % 5 !== 0) return;
    const el = document.createElement("div");
    el.className = "feedbackPrompt";
    el.innerHTML = `<span>War das hilfreich?</span><span><button data-v="up">👍</button><button data-v="down">👎</button></span>`;
    el.querySelectorAll("button").forEach((b) => b.onclick = () => {
      fetch(BACKEND + "/api/dashboard/interact", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + idToken },
        body: JSON.stringify({ itemType: "widget", action: b.dataset.v === "up" ? "praise" : "criticize", label: "attention widget usefulness" }),
      }).catch(() => {});
      el.remove();
    });
    $("wAttention").querySelector(".widget-body").appendChild(el);
  }

  // COROS tool results arrive as MCP content: [{type:"text", text: "<json or prose>"}]
  function formatRecentActivity(raw) {
    if (!raw) return "";
    try {
      const text = Array.isArray(raw) ? raw.map((c) => c.text ?? "").join(" ") : String(raw);
      let parsed;
      try { parsed = JSON.parse(text); } catch { return "Letzte Aktivität: " + text.slice(0, 140); }
      const list = Array.isArray(parsed) ? parsed : parsed?.records || parsed?.data || [parsed];
      const items = list.slice(0, 3).map((a) => {
        const date = a.date || a.startDate || a.startTime || "";
        const dist = a.distance ? (a.distance / 1000).toFixed(1) + " km" : "";
        const kind = a.sportType || a.sportName || a.name || "";
        return [date, kind, dist].filter(Boolean).join(" · ");
      });
      return items.length ? "Letzte Aktivität: " + items.join(" / ") : "";
    } catch { return ""; }
  }

  const RACE_DATE = new Date("2026-10-11T09:00:00+02:00");
  function daysToRace() {
    return Math.max(0, Math.ceil((RACE_DATE - new Date()) / 864e5));
  }

  function renderCoach(t) {
    if (!t) { $("coachBody").innerHTML = '<div class="empty">Keine Daten.</div>'; return; }
    let html = `<div class="countdown"><span class="n num">${daysToRace()}</span><span class="l">TAGE BIS<br>MARATHON MÜNCHEN</span></div>`;
    html += `<div class="coachToday">${esc(t.today || "")}</div>`;
    if (t.upcoming?.length) {
      html += '<div class="coachUpcoming">' + t.upcoming.map((u) => `<span class="num">${esc(u.date.slice(5))}</span> — ${esc(u.label)}`).join("<br>") + "</div>";
    }
    if (t.warnings?.length) {
      html += t.warnings.map((w) => `<div class="coachWarn">${esc(w)}</div>`).join("");
    }
    const activityText = formatRecentActivity(t.recentActivity);
    if (activityText) html += `<div class="coachActivity">${esc(activityText)}</div>`;
    $("coachBody").innerHTML = html;
  }

  function renderLearned(items) {
    if (!items?.length) { $("learnedBody").innerHTML = '<div class="empty">Noch nichts Kuratiertes. <a href="/dashboard.html">Kuratieren →</a></div>'; return; }
    $("learnedBody").innerHTML = items.map((l) => `<div class="learningItem">${esc(l.content)}</div>`).join("");
  }

  if (idToken) connect();
  window.addEventListener("load", initLogin);
</script>
</body>
</html>
