<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04080f">
<link rel="manifest" href="manifest.json">
<title>JARVIS</title>
<style>
  :root {
    --bg: #04080f;
    --panel: #0a1220;
    --cyan: #4fd8eb;
    --cyan-dim: #1d5f6b;
    --text: #cfe9ee;
    --gold: #e8b64c;
    --mail: #e8b64c;
    --cal: #4fd8eb;
    --task: #9d7bef;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -10%, #0b1a2e 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "SF Mono", "Segoe UI", system-ui, monospace;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid #12283d;
  }
  .reactor {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid var(--cyan);
    box-shadow: 0 0 12px var(--cyan), inset 0 0 10px var(--cyan);
    position: relative; flex-shrink: 0;
    animation: pulse 2.4s ease-in-out infinite;
  }
  .reactor::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 1px solid var(--cyan); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 10px var(--cyan), inset 0 0 8px var(--cyan); }
    50% { box-shadow: 0 0 22px var(--cyan), inset 0 0 14px var(--cyan); }
  }
  .thinking .reactor { animation-duration: 0.7s; }
  h1 { font-size: 16px; letter-spacing: 6px; color: var(--cyan); font-weight: 500; }
  #viewToggle {
    margin-left: auto; background: transparent; border: 1px solid var(--cyan-dim);
    color: var(--cyan); font-family: inherit; font-size: 11px; letter-spacing: 2px;
    padding: 5px 10px; border-radius: 3px; cursor: pointer;
  }
  #status { font-size: 10px; color: var(--cyan-dim); letter-spacing: 1px; text-transform: uppercase; }

  /* Dashboard */
  #dash { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  #dash.active { display: flex; }
  #graphWrap { position: relative; height: 110px; flex-shrink: 0; }
  #graph { width: 100%; height: 100%; display: block; touch-action: none; opacity: 0.85; }
  #detail {
    position: absolute; left: 10px; right: 10px; bottom: 4px;
    background: #0a1220ee; border: 1px solid var(--cyan-dim); border-radius: 4px;
    padding: 8px 10px; font-size: 11px; line-height: 1.4; display: none;
    max-height: 60px; overflow-y: auto; z-index: 2;
  }
  #widgets { flex: 1; overflow-y: auto; padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 14px; }
  .widget {
    position: relative; isolation: isolate; overflow: hidden;
    background-color: var(--panel); background-size: cover; background-position: center;
    border-radius: 20px; box-shadow: 0 10px 28px -12px rgba(0,0,0,0.65), 0 0 0 1px #1a3a5555;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .widget::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(165deg, rgba(6,12,22,0.55) 0%, rgba(6,12,22,0.88) 55%, rgba(6,12,22,0.97) 100%);
  }
  #wAttention { background-image: url("https://images.unsplash.com/photo-1644088379091-d574269d422f?q=80&w=900&auto=format&fit=crop"); }
  #wCoach { background-image: url("https://images.unsplash.com/photo-1552674605-db6ffd4facb5?q=80&w=900&auto=format&fit=crop"); }
  #wLearned { background-image: url("https://images.unsplash.com/photo-1719650592946-55163c4994cb?q=80&w=900&auto=format&fit=crop"); }
  .widget h2 {
    font-size: 10px; letter-spacing: 2px; color: #9fc3d4; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between;
  }
  .widget .empty { font-size: 12px; color: #9fc3d4aa; padding: 6px 0; }

  /* Attention queue: one card at a time */
  #attnCard { display: flex; flex-direction: column; gap: 8px; }
  #attnCard .prio { font-size: 9px; letter-spacing: 2px; }
  #attnCard .prio.critical { color: #e86b6b; }
  #attnCard .prio.high { color: var(--gold); }
  #attnCard .label { font-size: 14px; line-height: 1.4; }
  #attnCard .meta { font-size: 11px; color: #6f8fa0; }
  #attnActions { display: flex; gap: 8px; }
  .btn {
    flex: 1; background: transparent; border: 1px solid var(--cyan-dim); color: var(--text);
    padding: 8px; border-radius: 5px; font: inherit; font-size: 11px; letter-spacing: 1px; cursor: pointer;
  }
  .btn:hover { border-color: var(--cyan); color: var(--cyan); }
  #attnProgress { font-size: 10px; color: var(--cyan-dim); text-align: right; }

  /* Coach widget */
  .coachToday { font-size: 13px; line-height: 1.5; }
  .coachUpcoming { font-size: 11px; color: #8fb3c2; line-height: 1.6; }
  .coachWarn { font-size: 11px; color: #e8b64c; }
  .coachActivity { font-size: 11px; color: #6f8fa0; }

  .learningItem { font-size: 12px; line-height: 1.5; padding: 4px 0; border-top: 1px solid #12283d; }
  .learningItem:first-child { border-top: none; }

  .feedbackPrompt {
    font-size: 11px; color: var(--cyan-dim); display: flex; align-items: center; justify-content: space-between;
    padding-top: 6px; border-top: 1px solid #12283d;
  }
  .feedbackPrompt button { background: none; border: none; color: var(--cyan); font-size: 14px; cursor: pointer; padding: 0 4px; }

  /* Chat */
  #chat { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  #chat.active { display: flex; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 4px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: #14293f; border-right: 2px solid var(--gold); }
  .jarvis { align-self: flex-start; background: var(--panel); border-left: 2px solid var(--cyan); }
  .err { border-left-color: #e85c5c; color: #f0b0b0; }
  form { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid #12283d; }
  input[type=text] {
    flex: 1; background: var(--panel); border: 1px solid #1a3a55;
    color: var(--text); padding: 12px 14px; border-radius: 4px;
    font-size: 16px; font-family: inherit; outline: none;
  }
  input[type=text]:focus { border-color: var(--cyan-dim); box-shadow: 0 0 8px #4fd8eb33; }
  form button {
    background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
    padding: 0 18px; border-radius: 4px; font-size: 14px; letter-spacing: 2px; cursor: pointer;
  }
  #login {
    position: fixed; inset: 0; background: var(--bg); z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
  }
</style>
</head>
<body>
  <header id="hdr">
    <div class="reactor"></div>
    <h1>JARVIS</h1>
    <span id="status">offline</span>
    <button id="viewToggle">CHAT</button>
  </header>

  <div id="login">
    <div class="reactor" style="width:70px;height:70px"></div>
    <div style="letter-spacing:5px;color:var(--cyan)">IDENTIFY YOURSELF</div>
    <div id="gbtn"></div>
    <div id="loginerr" style="color:#e85c5c;font-size:12px"></div>
  </div>

  <div id="dash" class="active">
    <div id="graphWrap">
      <canvas id="graph"></canvas>
      <div id="detail"></div>
    </div>
    <div id="widgets">
      <div class="widget" id="wAttention">
        <h2><span>NEEDS ATTENTION</span><span id="attnProgress"></span></h2>
        <div id="attnCard"><div class="empty">Loading…</div></div>
        <div id="attnActions" style="display:none">
          <button class="btn" id="attnDismiss">ERLEDIGT</button>
          <button class="btn" id="attnSkip">SPÄTER →</button>
        </div>
      </div>

      <div class="widget" id="wCoach">
        <h2>RUNNING COACH</h2>
        <div id="coachBody"><div class="empty">Loading…</div></div>
      </div>

      <div class="widget" id="wLearned">
        <h2>GELERNT</h2>
        <div id="learnedBody"><div class="empty">Loading…</div></div>
      </div>
    </div>
  </div>

  <div id="chat">
    <div id="log"></div>
  </div>

  <form id="form">
    <input type="text" id="input" placeholder="At your service, sir…" autocomplete="off">
    <button>SEND</button>
  </form>

<script src="https://accounts.google.com/gsi/client" async></script>
<script>
  const $ = (id) => document.getElementById(id);
  const BACKEND = new URLSearchParams(location.search).get("backend") ?? localStorage.getItem("backend") ?? location.origin;
  if (new URLSearchParams(location.search).get("backend")) localStorage.setItem("backend", BACKEND);
  const WS_URL = BACKEND.replace(/^http/, "ws") + "/ws";
  let ws, idToken = sessionStorage.getItem("idToken");

  // ---------- view toggle ----------
  let view = "dash";
  $("viewToggle").onclick = () => {
    view = view === "dash" ? "chat" : "dash";
    $("dash").classList.toggle("active", view === "dash");
    $("chat").classList.toggle("active", view === "chat");
    $("viewToggle").textContent = view === "dash" ? "CHAT" : "GRAPH";
    if (view === "dash") resize();
  };

  // ---------- auth ----------
  async function initLogin() {
    try {
      const cfg = await fetch(BACKEND + "/config").then((r) => r.json());
      google.accounts.id.initialize({
        client_id: cfg.googleClientId,
        callback: (resp) => { idToken = resp.credential; sessionStorage.setItem("idToken", idToken); connect(); },
      });
      google.accounts.id.renderButton($("gbtn"), { theme: "filled_black", size: "large" });
    } catch { $("loginerr").textContent = "Backend unreachable: " + BACKEND; }
  }

  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => { $("status").textContent = "authenticating"; ws.send(JSON.stringify({ type: "auth", token: idToken })); };
    ws.onclose = () => { $("status").textContent = "reconnecting"; setTimeout(connect, 2000); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === "authed") { $("login").style.display = "none"; $("status").textContent = "online"; loadDashboard(); }
      if (m.type === "reply") { add(m.text, "jarvis"); setThinking(false); loadDashboard(); }
      if (m.type === "error") {
        if (m.text === "Access denied." || m.text === "Not authenticated.") {
          sessionStorage.removeItem("idToken"); idToken = null; if (ws) ws.onclose = null;
          $("login").style.display = "flex"; $("loginerr").textContent = m.text; return;
        }
        add(m.text, "jarvis err"); setThinking(false);
      }
      if (m.type === "status") {
        if (m.text === "idle") setThinking(false);
        else { setThinking(true); $("status").textContent = m.text; }
      }
    };
  }
  function setThinking(on) { $("hdr").classList.toggle("thinking", on); if (!on) $("status").textContent = "online"; }
  function add(text, cls) {
    if (view !== "chat") $("viewToggle").click();
    const d = document.createElement("div");
    d.className = "msg " + cls; d.textContent = text;
    $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
  }
  $("form").onsubmit = (e) => {
    e.preventDefault();
    const text = $("input").value.trim();
    if (!text || !ws || ws.readyState !== 1) return;
    add(text, "user");
    ws.send(JSON.stringify({ text }));
    $("input").value = "";
  };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // ---------- graph: purely decorative ambient node cluster ----------
  const canvas = $("graph"), ctx = canvas.getContext("2d");
  let nodes = [], links = [], W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildAmbient();
  }
  window.addEventListener("resize", resize);

  function buildAmbient() {
    nodes = []; links = [];
    const addNode = (n) => { n.x = W/2 + (Math.random()-0.5)*W*0.6; n.y = H/2 + (Math.random()-0.5)*H*0.6; n.vx = (Math.random()-0.5)*0.3; n.vy = (Math.random()-0.5)*0.3; nodes.push(n); return n; };
    const center = addNode({ r: 14, color: "#4fd8eb", fixed: true });
    center.x = W/2; center.y = H/2;
    const colors = ["#4fd8eb", "#e8b64c", "#9d7bef"];
    for (let i = 0; i < 9; i++) {
      const n = addNode({ r: 3 + Math.random()*3, color: colors[i % colors.length] });
      links.push({ a: center, b: n, d: 30 + Math.random()*40 });
    }
  }

  function tick() {
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx*dx + dy*dy || 1, d = Math.sqrt(d2);
        const rep = 400 / d2;
        const fx = dx / d * rep, fy = dy / d * rep;
        a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
      }
    }
    for (const l of links) {
      let dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
      const d = Math.sqrt(dx*dx + dy*dy) || 1;
      const f = (d - l.d) * 0.015;
      const fx = dx / d * f, fy = dy / d * f;
      l.a.vx += fx; l.a.vy += fy; l.b.vx -= fx; l.b.vy -= fy;
    }
    for (const n of nodes) {
      if (n.fixed) { n.vx = 0; n.vy = 0; continue; }
      n.vx += (W/2 - n.x) * 0.001; n.vy += (H/2 - n.y) * 0.001;
      n.vx *= 0.92; n.vy *= 0.92;
      n.x += n.vx; n.y += n.vy;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "#1a3a5566"; ctx.lineWidth = 1;
    for (const l of links) { ctx.beginPath(); ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.b.x, l.b.y); ctx.stroke(); }
    for (const n of nodes) {
      ctx.shadowColor = n.color; ctx.shadowBlur = n.r * 1.8;
      ctx.fillStyle = n.fixed ? "#0a1220" : n.color;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7); ctx.fill();
      if (n.fixed) { ctx.strokeStyle = n.color; ctx.lineWidth = 1.5; ctx.stroke(); }
      ctx.shadowBlur = 0;
    }
    tick();
    requestAnimationFrame(draw);
  }

  // ---------- dashboard widgets ----------
  let attnQueue = [], attnIndex = 0, interactionCount = 0;

  async function loadDashboard() {
    try {
      const r = await fetch(BACKEND + "/api/dashboard", { headers: { Authorization: "Bearer " + idToken } });
      if (!r.ok) return;
      const data = await r.json();
      attnQueue = data.attention || []; attnIndex = 0;
      renderAttentionCard();
      renderCoach(data.training);
      renderLearned(data.learnings);
    } catch {}
  }
  setInterval(loadDashboard, 5 * 60 * 1000);

  function renderAttentionCard() {
    const card = $("attnCard"), actions = $("attnActions"), progress = $("attnProgress");
    if (attnIndex >= attnQueue.length) {
      card.innerHTML = '<div class="empty">Nichts Dringendes — sauber.</div>';
      actions.style.display = "none"; progress.textContent = "";
      return;
    }
    const it = attnQueue[attnIndex];
    card.innerHTML = `
      <div class="prio ${esc(it.priority)}">${it.priority.toUpperCase()} · ${esc(it.type)}</div>
      <div class="label">${esc(it.label)}</div>
      ${it.meta ? `<div class="meta">${esc(it.meta)}</div>` : ""}
    `;
    actions.style.display = "flex";
    progress.textContent = `${attnIndex + 1}/${attnQueue.length}`;
  }

  async function interact(item, action) {
    interactionCount++;
    try {
      await fetch(BACKEND + "/api/dashboard/interact", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + idToken },
        body: JSON.stringify({ itemType: item.type, action, label: item.label }),
      });
    } catch {}
    attnIndex++;
    renderAttentionCard();
    maybeShowFeedbackPrompt();
  }
  $("attnDismiss").onclick = () => interact(attnQueue[attnIndex], "dismiss");
  $("attnSkip").onclick = () => interact(attnQueue[attnIndex], "skip");

  function maybeShowFeedbackPrompt() {
    if (interactionCount % 5 !== 0) return;
    const el = document.createElement("div");
    el.className = "feedbackPrompt";
    el.innerHTML = `<span>War das hilfreich?</span><span><button data-v="up">👍</button><button data-v="down">👎</button></span>`;
    el.querySelectorAll("button").forEach((b) => b.onclick = () => {
      fetch(BACKEND + "/api/dashboard/interact", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + idToken },
        body: JSON.stringify({ itemType: "widget", action: b.dataset.v === "up" ? "praise" : "criticize", label: "attention widget usefulness" }),
      }).catch(() => {});
      el.remove();
    });
    $("wAttention").appendChild(el);
  }

  // COROS tool results arrive as MCP content: [{type:"text", text: "<json or prose>"}]
  function formatRecentActivity(raw) {
    if (!raw) return "";
    try {
      const text = Array.isArray(raw) ? raw.map((c) => c.text ?? "").join(" ") : String(raw);
      let parsed;
      try { parsed = JSON.parse(text); } catch { return "Letzte Aktivität: " + text.slice(0, 140); }
      const list = Array.isArray(parsed) ? parsed : parsed?.records || parsed?.data || [parsed];
      const items = list.slice(0, 3).map((a) => {
        const date = a.date || a.startDate || a.startTime || "";
        const dist = a.distance ? (a.distance / 1000).toFixed(1) + " km" : "";
        const kind = a.sportType || a.sportName || a.name || "";
        return [date, kind, dist].filter(Boolean).join(" · ");
      });
      return items.length ? "Letzte Aktivität: " + items.join(" / ") : "";
    } catch { return ""; }
  }

  function renderCoach(t) {
    if (!t) { $("coachBody").innerHTML = '<div class="empty">Keine Daten.</div>'; return; }
    let html = `<div class="coachToday">${esc(t.today || "")}</div>`;
    if (t.upcoming?.length) {
      html += '<div class="coachUpcoming">' + t.upcoming.map((u) => `${esc(u.date.slice(5))} — ${esc(u.label)}`).join("<br>") + "</div>";
    }
    if (t.warnings?.length) {
      html += t.warnings.map((w) => `<div class="coachWarn">${esc(w)}</div>`).join("");
    }
    const activityText = formatRecentActivity(t.recentActivity);
    if (activityText) html += `<div class="coachActivity">${esc(activityText)}</div>`;
    $("coachBody").innerHTML = html;
  }

  function renderLearned(items) {
    if (!items?.length) { $("learnedBody").innerHTML = '<div class="empty">Noch nichts Kuratiertes. <a href="/dashboard.html" style="color:var(--cyan)">Kuratieren →</a></div>'; return; }
    $("learnedBody").innerHTML = items.map((l) => `<div class="learningItem">${esc(l.content)}</div>`).join("");
  }

  resize(); draw();
  if (idToken) connect();
  window.addEventListener("load", initLogin);
</script>
</body>
</html>
