<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04080f">
<link rel="manifest" href="manifest.json">
<title>JARVIS</title>
<style>
  :root {
    --bg: #04080f;
    --panel: #0a1220;
    --cyan: #4fd8eb;
    --cyan-dim: #1d5f6b;
    --text: #cfe9ee;
    --gold: #e8b64c;
    --mail: #e8b64c;
    --cal: #4fd8eb;
    --task: #9d7bef;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -10%, #0b1a2e 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "SF Mono", "Segoe UI", system-ui, monospace;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid #12283d;
  }
  .reactor {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid var(--cyan);
    box-shadow: 0 0 12px var(--cyan), inset 0 0 10px var(--cyan);
    position: relative; flex-shrink: 0;
    animation: pulse 2.4s ease-in-out infinite;
  }
  .reactor::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 1px solid var(--cyan); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 10px var(--cyan), inset 0 0 8px var(--cyan); }
    50% { box-shadow: 0 0 22px var(--cyan), inset 0 0 14px var(--cyan); }
  }
  .thinking .reactor { animation-duration: 0.7s; }
  h1 { font-size: 16px; letter-spacing: 6px; color: var(--cyan); font-weight: 500; }
  #viewToggle {
    margin-left: auto; background: transparent; border: 1px solid var(--cyan-dim);
    color: var(--cyan); font-family: inherit; font-size: 11px; letter-spacing: 2px;
    padding: 5px 10px; border-radius: 3px; cursor: pointer;
  }
  #status { font-size: 10px; color: var(--cyan-dim); letter-spacing: 1px; text-transform: uppercase; }

  /* Dashboard */
  #dash { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  #dash.active { display: flex; }
  #graphWrap { flex: 1; position: relative; min-height: 0; }
  #graph { width: 100%; height: 100%; display: block; touch-action: none; }
  #legend {
    position: absolute; top: 8px; left: 10px; font-size: 10px; letter-spacing: 1px;
    display: flex; gap: 12px; color: var(--cyan-dim);
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  #detail {
    position: absolute; left: 10px; right: 10px; bottom: 10px;
    background: #0a1220ee; border: 1px solid var(--cyan-dim); border-radius: 4px;
    padding: 10px 12px; font-size: 12px; line-height: 1.5; display: none;
    max-height: 30%; overflow-y: auto;
  }
  #stats {
    display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #12283d;
  }
  .stat {
    flex: 1; background: var(--panel); border: 1px solid #1a3a55; border-radius: 4px;
    padding: 8px; text-align: center;
  }
  .stat b { display: block; font-size: 20px; color: var(--cyan); font-weight: 500; }
  .stat span { font-size: 9px; letter-spacing: 2px; color: var(--cyan-dim); }

  /* Chat */
  #chat { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  #chat.active { display: flex; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 4px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: #14293f; border-right: 2px solid var(--gold); }
  .jarvis { align-self: flex-start; background: var(--panel); border-left: 2px solid var(--cyan); }
  .err { border-left-color: #e85c5c; color: #f0b0b0; }
  form { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid #12283d; }
  input[type=text] {
    flex: 1; background: var(--panel); border: 1px solid #1a3a55;
    color: var(--text); padding: 12px 14px; border-radius: 4px;
    font-size: 16px; font-family: inherit; outline: none;
  }
  input[type=text]:focus { border-color: var(--cyan-dim); box-shadow: 0 0 8px #4fd8eb33; }
  form button {
    background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
    padding: 0 18px; border-radius: 4px; font-size: 14px; letter-spacing: 2px; cursor: pointer;
  }
  #login {
    position: fixed; inset: 0; background: var(--bg); z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
  }
</style>
</head>
<body>
  <header id="hdr">
    <div class="reactor"></div>
    <h1>JARVIS</h1>
    <span id="status">offline</span>
    <button id="viewToggle">CHAT</button>
  </header>

  <div id="login">
    <div class="reactor" style="width:70px;height:70px"></div>
    <div style="letter-spacing:5px;color:var(--cyan)">IDENTIFY YOURSELF</div>
    <div id="gbtn"></div>
    <div id="loginerr" style="color:#e85c5c;font-size:12px"></div>
  </div>

  <div id="dash" class="active">
    <div id="graphWrap">
      <canvas id="graph"></canvas>
      <div id="legend">
        <span><i class="dot" style="background:var(--cal)"></i>CALENDAR</span>
        <span><i class="dot" style="background:var(--mail)"></i>MAIL</span>
        <span><i class="dot" style="background:var(--task)"></i>TASKS</span>
      </div>
      <div id="detail"></div>
    </div>
    <div id="stats">
      <div class="stat"><b id="stEvents">–</b><span>EVENTS 7D</span></div>
      <div class="stat"><b id="stMail">–</b><span>UNREAD</span></div>
      <div class="stat"><b id="stTasks">–</b><span>OPEN TASKS</span></div>
    </div>
  </div>

  <div id="chat">
    <div id="log"></div>
  </div>

  <form id="form">
    <input type="text" id="input" placeholder="At your service, sir…" autocomplete="off">
    <button>SEND</button>
  </form>

<script src="https://accounts.google.com/gsi/client" async></script>
<script>
  const $ = (id) => document.getElementById(id);
  const BACKEND = new URLSearchParams(location.search).get("backend") ?? localStorage.getItem("backend") ?? location.origin;
  if (new URLSearchParams(location.search).get("backend")) localStorage.setItem("backend", BACKEND);
  const WS_URL = BACKEND.replace(/^http/, "ws") + "/ws";
  let ws, idToken = sessionStorage.getItem("idToken");

  // ---------- view toggle ----------
  let view = "dash";
  $("viewToggle").onclick = () => {
    view = view === "dash" ? "chat" : "dash";
    $("dash").classList.toggle("active", view === "dash");
    $("chat").classList.toggle("active", view === "chat");
    $("viewToggle").textContent = view === "dash" ? "CHAT" : "GRAPH";
    if (view === "dash") resize();
  };

  // ---------- auth ----------
  async function initLogin() {
    try {
      const cfg = await fetch(BACKEND + "/config").then((r) => r.json());
      google.accounts.id.initialize({
        client_id: cfg.googleClientId,
        callback: (resp) => { idToken = resp.credential; sessionStorage.setItem("idToken", idToken); connect(); },
      });
      google.accounts.id.renderButton($("gbtn"), { theme: "filled_black", size: "large" });
    } catch { $("loginerr").textContent = "Backend unreachable: " + BACKEND; }
  }

  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => { $("status").textContent = "authenticating"; ws.send(JSON.stringify({ type: "auth", token: idToken })); };
    ws.onclose = () => { $("status").textContent = "reconnecting"; setTimeout(connect, 2000); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === "authed") { $("login").style.display = "none"; $("status").textContent = "online"; loadOverview(); }
      if (m.type === "reply") { add(m.text, "jarvis"); setThinking(false); loadOverview(); }
      if (m.type === "error") {
        if (m.text === "Access denied." || m.text === "Not authenticated.") {
          sessionStorage.removeItem("idToken"); idToken = null; if (ws) ws.onclose = null;
          $("login").style.display = "flex"; $("loginerr").textContent = m.text; return;
        }
        add(m.text, "jarvis err"); setThinking(false);
      }
      if (m.type === "status") {
        if (m.text === "idle") setThinking(false);
        else { setThinking(true); $("status").textContent = m.text; }
      }
    };
  }
  function setThinking(on) { $("hdr").classList.toggle("thinking", on); if (!on) $("status").textContent = "online"; }
  function add(text, cls) {
    if (view !== "chat") $("viewToggle").click();
    const d = document.createElement("div");
    d.className = "msg " + cls; d.textContent = text;
    $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
  }
  $("form").onsubmit = (e) => {
    e.preventDefault();
    const text = $("input").value.trim();
    if (!text || !ws || ws.readyState !== 1) return;
    add(text, "user");
    ws.send(JSON.stringify({ text }));
    $("input").value = "";
  };

  // ---------- graph (Obsidian-style force layout) ----------
  const canvas = $("graph"), ctx = canvas.getContext("2d");
  let nodes = [], links = [], dragging = null, W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);

  const COLORS = { center: "#4fd8eb", cal: "#4fd8eb", mail: "#e8b64c", task: "#9d7bef" };

  function buildGraph(data) {
    nodes = []; links = [];
    const addNode = (n) => { n.x = W/2 + (Math.random()-0.5)*60; n.y = H/2 + (Math.random()-0.5)*60; n.vx = 0; n.vy = 0; nodes.push(n); return n; };
    const center = addNode({ id: "me", label: "TOM", r: 16, type: "center", fixed: true });
    center.x = W/2; center.y = H/2;

    const hubs = {
      cal: addNode({ id: "cal", label: "CALENDAR", r: 10, type: "cal" }),
      mail: addNode({ id: "mail", label: "MAIL", r: 10, type: "mail" }),
      task: addNode({ id: "task", label: "TASKS", r: 10, type: "task" }),
    };
    for (const h of Object.values(hubs)) links.push({ a: center, b: h, d: 90 });

    for (const ev of data.events.slice(0, 12)) {
      const day = ev.start?.slice(5, 10) ?? "";
      const n = addNode({ id: "e" + ev.id, label: ev.summary ?? "(event)", sub: day + (ev.start?.length > 10 ? " " + ev.start.slice(11,16) : ""), r: 6, type: "cal", detail: ev });
      links.push({ a: hubs.cal, b: n, d: 60 });
    }
    for (const em of data.emails.slice(0, 8)) {
      const n = addNode({ id: "m" + em.id, label: (em.subject || "(no subject)").slice(0, 30), sub: (em.from||"").replace(/<.*>/, "").trim().slice(0, 25), r: 6, type: "mail", detail: em });
      links.push({ a: hubs.mail, b: n, d: 60 });
    }
    for (const t of data.tasks.slice(0, 10)) {
      const n = addNode({ id: "t" + t.id, label: (t.title||"").slice(0, 30), sub: t.due ? t.due.slice(5, 10) : "", r: 6, type: "task", detail: t });
      links.push({ a: hubs.task, b: n, d: 60 });
    }
  }

  function tick() {
    // forces
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx*dx + dy*dy || 1, d = Math.sqrt(d2);
        const rep = 900 / d2;
        const fx = dx / d * rep, fy = dy / d * rep;
        a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
      }
    }
    for (const l of links) {
      let dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
      const d = Math.sqrt(dx*dx + dy*dy) || 1;
      const f = (d - l.d) * 0.02;
      const fx = dx / d * f, fy = dy / d * f;
      l.a.vx += fx; l.a.vy += fy; l.b.vx -= fx; l.b.vy -= fy;
    }
    for (const n of nodes) {
      if (n.fixed || n === dragging) { n.vx = 0; n.vy = 0; continue; }
      n.vx += (W/2 - n.x) * 0.0015; n.vy += (H/2 - n.y) * 0.0015;
      n.vx *= 0.85; n.vy *= 0.85;
      n.x += n.vx; n.y += n.vy;
      n.x = Math.max(15, Math.min(W - 15, n.x));
      n.y = Math.max(15, Math.min(H - 15, n.y));
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "#1a3a5588"; ctx.lineWidth = 1;
    for (const l of links) {
      ctx.beginPath(); ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.b.x, l.b.y); ctx.stroke();
    }
    for (const n of nodes) {
      const c = COLORS[n.type];
      ctx.shadowColor = c; ctx.shadowBlur = n.r * 1.6;
      ctx.fillStyle = n.type === "center" ? "#0a1220" : c;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7); ctx.fill();
      if (n.type === "center" || n.r >= 10) {
        ctx.strokeStyle = c; ctx.lineWidth = 1.5; ctx.stroke();
      }
      ctx.shadowBlur = 0;
      if (n.r >= 10 || nodes.length < 25) {
        ctx.fillStyle = "#cfe9eecc"; ctx.font = "9px monospace"; ctx.textAlign = "center";
        ctx.fillText(n.label.slice(0, 18), n.x, n.y + n.r + 11);
      }
    }
    tick();
    requestAnimationFrame(draw);
  }

  function nodeAt(x, y) {
    return nodes.find(n => (n.x-x)**2 + (n.y-y)**2 < (n.r+8)**2);
  }
  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return [p.clientX - r.left, p.clientY - r.top];
  };
  const down = (e) => {
    const [x, y] = pos(e);
    const n = nodeAt(x, y);
    if (n) { dragging = n; showDetail(n); e.preventDefault(); }
  };
  const move = (e) => { if (dragging) { const [x, y] = pos(e); dragging.x = x; dragging.y = y; e.preventDefault(); } };
  const up = () => (dragging = null);
  canvas.addEventListener("mousedown", down); canvas.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
  canvas.addEventListener("touchstart", down, {passive:false}); canvas.addEventListener("touchmove", move, {passive:false}); window.addEventListener("touchend", up);

  function showDetail(n) {
    const d = $("detail");
    if (!n.detail) { d.style.display = "none"; return; }
    let html = `<b style="color:${COLORS[n.type]}">${esc(n.label)}</b><br>`;
    if (n.type === "cal") html += `${esc(n.detail.start ?? "")} → ${esc(n.detail.end ?? "")}${n.detail.location ? "<br>📍 " + esc(n.detail.location) : ""}`;
    if (n.type === "mail") html += `${esc(n.detail.from ?? "")}<br>${esc(n.detail.snippet ?? "")}`;
    if (n.type === "task") html += `${n.detail.due ? "due " + esc(n.detail.due.slice(0,10)) : "no due date"}${n.detail.notes ? "<br>" + esc(n.detail.notes) : ""}`;
    d.innerHTML = html; d.style.display = "block";
    clearTimeout(showDetail.t); showDetail.t = setTimeout(() => (d.style.display = "none"), 6000);
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  async function loadOverview() {
    try {
      const r = await fetch(BACKEND + "/api/overview", { headers: { Authorization: "Bearer " + idToken } });
      if (!r.ok) return;
      const data = await r.json();
      $("stEvents").textContent = data.events.length;
      $("stMail").textContent = data.emails.length;
      $("stTasks").textContent = data.tasks.length;
      resize(); buildGraph(data);
    } catch {}
  }
  setInterval(loadOverview, 5 * 60 * 1000);

  resize(); draw();
  if (idToken) connect();
  window.addEventListener("load", initLogin);
</script>
</body>
</html>
