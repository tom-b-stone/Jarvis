<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04080f">
<title>JARVIS — Learnings</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #04080f;
    --panel: #0a1220;
    --cyan: #4fd8eb;
    --cyan-dim: #1d5f6b;
    --text: #cfe9ee;
    --gold: #e8b64c;
    --err: #e86b6b;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% -10%, #0b1a2e 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "SF Mono", "Segoe UI", system-ui, monospace;
    min-height: 100%;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 20px; border-bottom: 1px solid #12283d;
  }
  header h1 { font-size: 15px; letter-spacing: 3px; font-weight: 600; color: var(--cyan); }
  main { max-width: 760px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  #login { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 80px 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 4px; }
  .tab {
    background: none; border: 1px solid var(--cyan-dim); color: var(--text);
    padding: 6px 14px; border-radius: 6px; font: inherit; font-size: 12px; cursor: pointer;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .tab.active { border-color: var(--cyan); color: var(--cyan); background: #0d1f2e; }
  .card {
    background: var(--panel); border: 1px solid #12283d; border-radius: 10px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .card .type {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold);
  }
  .card .content { font-size: 14px; line-height: 1.5; }
  .card .meta { font-size: 11px; color: #5f7f8f; }
  .card .actions { display: flex; gap: 8px; margin-top: 4px; }
  button.action {
    background: none; border: 1px solid var(--cyan-dim); color: var(--text);
    padding: 5px 12px; border-radius: 6px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button.action:hover { border-color: var(--cyan); color: var(--cyan); }
  button.action.danger:hover { border-color: var(--err); color: var(--err); }
  .empty { text-align: center; color: #5f7f8f; padding: 40px 0; font-size: 13px; }
</style>
</head>
<body>
  <div id="login">
    <div style="font-size:13px; letter-spacing:2px; color:var(--cyan)">IDENTIFY YOURSELF</div>
    <div id="gbtn"></div>
  </div>

  <div id="app" style="display:none">
    <header>
      <h1>JARVIS · LEARNINGS</h1>
      <a href="/" style="color:var(--cyan-dim); font-size:12px; text-decoration:none">← back</a>
    </header>
    <main>
      <div class="tabs">
        <button class="tab active" data-status="auto">Pending</button>
        <button class="tab" data-status="approved">Approved</button>
      </div>
      <div id="list"></div>
    </main>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  let idToken = sessionStorage.getItem("idToken");
  let status = "auto";

  async function initLogin() {
    try {
      const cfg = await fetch("/config").then((r) => r.json());
      google.accounts.id.initialize({
        client_id: cfg.googleClientId,
        callback: (resp) => { idToken = resp.credential; sessionStorage.setItem("idToken", idToken); showApp(); },
      });
      google.accounts.id.renderButton($("gbtn"), { theme: "filled_black", size: "large" });
      if (idToken) showApp();
    } catch { $("login").innerHTML = "Backend unreachable"; }
  }

  function showApp() {
    $("login").style.display = "none";
    $("app").style.display = "block";
    load();
  }

  document.querySelectorAll(".tab").forEach((t) => {
    t.onclick = () => {
      document.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
      t.classList.add("active");
      status = t.dataset.status;
      load();
    };
  });

  async function load() {
    $("list").innerHTML = '<div class="empty">Loading…</div>';
    const res = await fetch(`/api/learnings?status=${status}`, { headers: { Authorization: `Bearer ${idToken}` } });
    if (res.status === 401) { sessionStorage.removeItem("idToken"); idToken = null; location.reload(); return; }
    const items = await res.json();
    if (!res.ok) { $("list").innerHTML = `<div class="empty">Error: ${items.error ?? res.status}</div>`; return; }
    if (!items.length) { $("list").innerHTML = '<div class="empty">Nothing here yet.</div>'; return; }
    $("list").innerHTML = "";
    for (const it of items) $("list").appendChild(card(it));
  }

  function card(it) {
    const d = document.createElement("div");
    d.className = "card";
    const actions = status === "auto"
      ? `<button class="action" data-act="approve">Approve</button><button class="action danger" data-act="delete">Delete</button>`
      : `<button class="action danger" data-act="delete">Delete</button>`;
    d.innerHTML = `
      <div class="type">${it.type}</div>
      <div class="content"></div>
      <div class="meta">${new Date(it.created_at).toLocaleString()}${it.tags?.length ? " · " + it.tags.join(", ") : ""}</div>
      <div class="actions">${actions}</div>
    `;
    d.querySelector(".content").textContent = it.content;
    d.querySelector('[data-act="delete"]').onclick = async () => {
      await fetch(`/api/learnings/${it.id}`, { method: "DELETE", headers: { Authorization: `Bearer ${idToken}` } });
      load();
    };
    const approveBtn = d.querySelector('[data-act="approve"]');
    if (approveBtn) approveBtn.onclick = async () => {
      await fetch(`/api/learnings/approve/${it.id}`, { method: "POST", headers: { Authorization: `Bearer ${idToken}` } });
      load();
    };
    return d;
  }

  initLogin();
</script>
</body>
</html>
